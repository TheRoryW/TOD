 XBJ_mothership_equipment_0: "大明帝国国立航空设计研究院 “鲲鹏” 飞行战舰"
 XBJ_mothership_equipment_0_short: "“鲲鹏”飞行战舰"
 XBJ_infantry_equipment_0: "辽阳造 昌德廿年式 辽阳武备设计所 两分手装步铳"
 XBJ_infantry_equipment_0_short: "辽阳造"
 XBJ_infantry_equipment_0_desc: "1908年，明帝国辽阳武备设计所兼采勒贝尔M1886式步枪、莫辛-纳甘M1891式步枪等设计优点，结合明帝国陆军实情，成功研制出新型步枪昌德廿年式。该步枪采用昌德十二年式两分步枪弹（6.67x66mm）与旋转后拉式枪机，弹容八发。该型步枪被广泛装备于天朝体系各国，活跃在大战及其他局部战争中，表现突出。"
 XBJ_infantry_equipment_1: "顺天造 昌德卅五年式 上国陆军军备研制院 两分手装步铳"
 XBJ_infantry_equipment_1_short: "顺天造"
 XBJ_infantry_equipment_1_desc: "1923年，明帝国上国陆军军备研制院应军机院要求，总结大战经验教训，在廿年式步枪基础上改进研发出卅五年式新型步枪。鉴于廿年式步枪存在威力过剩、枪长过长等缺陷，卅五年式步枪缩短了枪管长度，降低枪重，并改良枪机闭锁性能，使得该型步枪更为灵活。"
 XBJ_infantry_equipment_2: "武昌造 兴宪二年式 长江兵器制作所 两分连珠步铳"
 XBJ_infantry_equipment_2_short: "武昌造"
 XBJ_infantry_equipment_2_desc: "1939年，高烈度战争促使长江兵器制作所定型一款半自动步枪，最终被命名为兴宪二年式连珠步铳。该型步枪实际上大量借鉴了工程师刘庆恩在大战期间的超前设计，不过将子弹替换为昌德卌八年式两分步枪短弹（6.67x33mm），弹仓同时也被扩大为十发。为了节省子弹消耗，兴宪二年式连珠步铳可以通过旋转枪口集气筒改为手动射击。"
 XBJ_infantry_equipment_3: "西安造 兴宪五年式 刘庆恩设计院 试制两分自装陷阵步铳"
 XBJ_infantry_equipment_3_short: "西安造"
 XBJ_infantry_equipment_3_desc: "1942年，西北都督府旗下的刘庆恩设计院应要求为靖难军敢死队研制了一款具有划时代意义的新式导气式步枪。鉴于其仍然发射昌德卌八年式两分步枪短弹（6.67x33mm）而非手枪或机枪弹，该枪被西北都督府定义为“自装陷阵步铳”，采用三十五发双排弹匣供弹，枪机偏转式闭锁。尽管机械故障频发，其凶猛火力仍然让敢死队面前的敌人胆战心惊。"
 XBJ_infantry_at: "昌德卌八年式 上国陆军军备研制院 七分反战车歼击铳"
 XBJ_infantry_at_desc: "1936年，为了应对俄罗斯帝国新型战车日益增加的数量，上国陆军军备研制院在预算紧张的背景下仍然研制出了一款发射七分钨芯子弹（23.3mm）的大口径步枪，定型为昌德卌八年式反战车歼击铳。起初该歼击铳并未大量生产，且因过强的后座力撞碎士兵肩胛骨而臭名昭著。但经过兴宪五年的改造，轻量化的该枪得以大量投入使用，并对轻装甲目标取得了不少战果。"
 XBJ_infantry_at2: "西安造 兴宪七年式 刘庆恩设计院 两寸半后喷气炮"
 XBJ_infantry_at2_desc: "1944年，为了应对世界各国战车愈发厚重的装甲，增强步兵反装甲能力，刘庆恩设计院创造性地研制出一款轻便耐用的破甲弹发射器，通过炮尾向后喷气抵消后座力，使得这款反装甲武器在复杂地形作战中表现尤为突出。这种新式设计经过改良被定型为兴宪七年式两寸半后喷气炮，活跃在亚洲各大战场上。"
 XBJ_motorized_equipment_1: "白山机车总厂 昌德卌六年式 六十担军用运载车"
 XBJ_motorized_equipment_1_short: "六十担军用运载车"
 XBJ_motorized_equipment_1_desc: "大战后，明帝国军机院越发重视部队战略投送能力与后勤保障，而数款军用运载车正是在二十年代的黄金时期诞生的。1934年，从庚午财荒中恢复元气的白山机车总厂承担起了研制新型大载重运载车的任务，昌德卌六年式六十担（三吨）军用运载车应运而生，并很快取代了此前的诸多陈旧载重车，成为明帝国机动部队与后勤保障的中流砥柱。"
 XBJ_mechanized_equipment_1: "景山机车制作所 兴宪三年式 试制八十担半履带铁甲运兵车"
 XBJ_mechanized_equipment_1_short: "试制八十担半履带铁甲运兵车"
 XBJ_mechanized_equipment_1_desc: "也许是机缘巧合，景山机车制作所从二十年代的技术积淀中翻新出了新式机动车辆，这种新颖并奇怪的车辆前部的轮胎用于转向，后部的履带用于提供动力，并提升越野通过能力。车身包裹的一层焊接装甲能为其中的物资或人员提供一定的防御，使得这种运兵车能够抵近至敌方阵地面前咫尺之遥。"
