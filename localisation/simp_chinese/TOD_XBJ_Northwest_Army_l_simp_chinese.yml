GOS_XBJ_hetan_event.2.t:0 "遣使西北"
GOS_XBJ_hetan_event.2.d:0 "随着锦逆政权的崩溃，原本分崩离析的天下秩序向着统一迈出了坚实的一步。如今百废待兴，是时候遣使西北，重整天下了。"
GOS_XBJ_hetan_event.2.a:0 "遣使西北，邀请皇叔"
GOS_XBJ_hetan_event.3.t:0 "圣谕东来"
GOS_XBJ_hetan_event.3.d:0 "随着锦逆政权的崩溃，原本分崩离析的天下秩序向着统一迈出了坚实的一步。圣上如今遣使西来，与我们商议战后相关事宜。"
GOS_XBJ_hetan_event.3.a:0 "恭听圣谕"
GOS_XBJ_hetan_event.4.t:0 "提出请求"
GOS_XBJ_hetan_event.4.d:0 "随着谈判展开，我方对天子特使的请求如下：\n其一，保障西北军将士权力及功勋。西北军乃此次靖难讨逆之中坚，为护卫天子立下殊勋。天子还朝后，新立之政府应确保西北都督府相关人员地位，并对功勋卓著者予以叙功封赏。西北都督府之杰出人才，应参与新政府组建，参赞机务。\n其二，肃清大同逆党以固国本。 新政府须与“大同会”逆党彻底切割，泾渭分明。其中若有真心悔悟、愿为国效力者，可准其加入帝国宪政会效忠。然“大同会”作为组织，必须即刻解散。其内罪大恶极者，应明正典刑，追究罪责。唯此方可保大明列祖列宗之基业，社稷永固。"
GOS_XBJ_hetan_event.4.a:0 "决意报国，毫无私心"
GOS_XBJ_hetan_event.6.t:0 "西北军的提案"
GOS_XBJ_hetan_event.6.d:0 "随着谈判展开，西北军对我方的请求如下：\n其一，保障西北军将士权力及功勋。西北军乃此次靖难讨逆之中坚，为护卫天子立下殊勋。天子还朝后，新立之政府应确保西北都督府相关人员地位，并对功勋卓著者予以叙功封赏。西北都督府之杰出人才，应参与新政府组建，参赞机务。\n其二，肃清大同逆党以固国本。 新政府须与“大同会”逆党彻底切割，泾渭分明。其中若有真心悔悟、愿为国效力者，可准其加入帝国宪政会效忠。然“大同会”作为组织，必须即刻解散。其内罪大恶极者，应明正典刑，追究罪责。唯此方可保大明列祖列宗之基业，社稷永固。\n面对这些要求，我方需要形成一份最终议案，以回应是否接受这些要求。"
GOS_XBJ_hetan_event.6.a:0 "全都接受"
GOS_XBJ_hetan_event.6.b:0 "只接受第一条"
GOS_XBJ_hetan_event.6.c:0 "只接受第二条"
GOS_XBJ_hetan_event.6.e:0 "全都拒绝"
GOS_XBJ_hetan_event.7.t:0 "[GOS_XBJ_hetan_event_7_t]"
GOS_XBJ_hetan_event.7.d:0 "[GOS_XBJ_hetan_event_7_d]"
GOS_XBJ_hetan_event.7.a:0 "[GOS_XBJ_hetan_event_7_a]"
GOS_XBJ_hetan_event.7.b:0 "我们只能接受"
GOS_XBJ_hetan_event.5.t:0 "西北军与我方展开合并谈判"
GOS_XBJ_hetan_event.5.d:0 "西北军在与锦逆的战争中立有赫赫战功，是忠心之军，庆王也是忠心之臣啊。如今庆王也与我方展开会晤，希望大明重回安定。"
GOS_XBJ_hetan_event.5.a:0 "好的开始"
GOS_XBJ_hetan_event.8.t:0 "谈判成功"
GOS_XBJ_hetan_event.8.d:0 "西北军接受了我方的最终议案！此诚天命所归，万民翘首以待！即日当奉天子銮驾，还都顺天，重登大宝，再正乾坤！"
GOS_XBJ_hetan_event.8.a:0 "此皆忠良也！"
GOS_XBJ_hetan_event.9.t:0 "谈判失败"
GOS_XBJ_hetan_event.9.d:0 "西北军拒绝了我方的最终议案！边境之上，此前相安之景象荡然无存，阴云密布，剑拔弩张。局势骤紧，如弦满之弓。观此情状，恐唯有一番兵戎，方能廓清根本之争，决此乾坤之局。"
GOS_XBJ_hetan_event.9.a:0 "倚山山崩，恃人人叛！尔辈野心膨胀，竟至于斯？岂不痛乎！"
GOS_XBJ_hetan_event.10.t:0 "并非忠良！"
GOS_XBJ_hetan_event.10.d:0 "庆逆本是陛下原来派去西北的，后来锦逆谋逆，我双方本来相约共同平叛。但不成想，庆逆竟然也非忠良之辈，也在谋求大宝之位！"
GOS_XBJ_hetan_event.10.a:0 "倚山山崩，恃人人叛！尔辈野心膨胀，竟至于斯？岂不痛乎！"
GOS_XBJ_hetan_event.11.t:0 "特使西来"
GOS_XBJ_hetan_event.11.d:0 "随着锦逆政权的崩溃，原本分崩离析的天下秩序向着统一迈出了坚实的一步。庆王殿下如今派遣使者邀请天子北上回宫，与我们商议战后相关事宜。"
GOS_XBJ_hetan_event.11.a:0 "朕心甚慰"
GOS_XBJ_hetan_event_7_t_1:0 "天子同意了我们的请求！"
GOS_XBJ_hetan_event_7_t_2:0 "天子拒绝了我们的部分请求"
GOS_XBJ_hetan_event_7_t_3:0 "天子拒绝了我们的部分请求"
GOS_XBJ_hetan_event_7_t_4:0 "天子拒绝了我们的所有请求"
GOS_XBJ_hetan_event_7_d_1:0 "天子已俯允我部所请！为正义与秩序所流之碧血，终得昭彰！吾皇万岁！万岁！万万岁！"
GOS_XBJ_hetan_event_7_d_2:0 "消息传来，应天方面只应允了我们部分所请。在“保障西北军将士权力及功勋”方面，天子回绝了我们的请求。"
GOS_XBJ_hetan_event_7_d_3:0 "消息传来，应天方面只应允了我们部分所请。在“肃清大同逆党以固国本”方面，天子回绝了我们的请求。"
GOS_XBJ_hetan_event_7_d_4:0 "消息传来，应天方面居然拒绝了我们的所有请求！一时间西北大地群情激愤，不少地区甚至发生了学生、士兵和市民的游行抗议事件。对于这一结果……"
GOS_XBJ_hetan_event_7_a_1:0 "恭迎圣天子"
GOS_XBJ_hetan_event_7_a_2:0 "我们只能接受"
GOS_XBJ_hetan_event_7_a_3:0 "我们只能接受"
GOS_XBJ_hetan_event_7_a_4:0 "我们只能接受"

