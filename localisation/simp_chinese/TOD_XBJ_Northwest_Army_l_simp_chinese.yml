# ===== 本段为新增决议本地化 =====
XBJ_promote_officers:0 "恩赏军官"
XBJ_promote_officers_desc:0 "庆王下令从近卫军中擢拔优才，整饬饷银与晋升规制。将士得赏，必士气大振，军心稳固；然此举损及豪强利益，恐招致民间非议。若能妥善施为，即可换取将士效死用命之忠忱。"
XBJ_rural_relief:0 "乡野赈济计划"
XBJ_rural_relief_desc:0 "西北饥寒盛行，庆王谕令开仓放赈，将粮秣直接分发至佃户与牧民手中。此举虽短期内可能扰攘地方税赋征缴与治安，然所能赢取之民心拥戴，远非数座城池可比。"
XBJ_frontier_mobilize:0 "边陲动员"
XBJ_frontier_mobilize_desc:0 "以戍边将帅之名，重整营制，厉兵秣马，征召老兵乡勇以固守关隘。军心士气与战备得以提升，然难免征用民力与行政资材，致使后方一时困顿。此乃以小损换大安，固守西域疆土之必要代价。"
XBJ_propaganda_push:0 "文宣与风俗整合"
XBJ_propaganda_push_desc:0 "借由戏曲、文社与碑铭石刻，将‘开化启蒙’之理念广布边陲，化育百姓，以期消弭纷争与族裔隔阂。短期可收安定民心、稳固秩序之效，并为官府博取舆论主导与宣教之资。"
XBJ_secret_purge:0 "秘务清剿"
XBJ_secret_purge_desc:0 "于暗影之中肃清内奸，遣密探举发，下密令夜捕，可迅捷摧垮敌对网罗并截获机密。然此术代价在于破坏朝野信任——一旦事泄，恐将动摇朝中部分派系之根基。"
XBJ_industrial_investment:0 "扶植工坊与改良手工业"
XBJ_industrial_investment_desc:0 "以官商合办之法，资助作坊革新，引新式机械与管理之术。假以时日，铁器机具将日益精良，工匠技艺亦趋娴熟，可为军需与税赋奠定长远根基；然革新之际，必触犯守成者之利，当循序渐进而为之。"
XBJ_reward_landlords:0 "恩赏乡绅"
XBJ_reward_landlords_desc:0 "颁赐名号与土地特许以慰藉乡绅，赏赐能换来他们的忠诚与供应线的支持。此举可迅速提升地主的支持与影响，但须注意不能过度让利以致财政负担加重。"
XBJ_tax_relief_landlords:0 "暂行赋税宽免"
XBJ_tax_relief_landlords_desc:0 "对若干乡绅施行限期减免地税与关税，换取地方协助与治安维持。短期内财政收入受损，但能稳住地方精英，换来边陲稳定与粮食供给保障。"
# ===== 结束 =====

# 社群团结组新决议本地化
XBJ_shequn_education:0 "乡学与职业训练计划"
XBJ_shequn_education_desc:0 "由官府与绅商合办乡学与技术训练所，教授耕作改良与手工业技艺。此举能够长期提升社群的进步程度与互信，巩固地方认同，但短期需要投入师资与经费。"
XBJ_shequn_mutual_aid:0 "地方互助会"
XBJ_shequn_mutual_aid_desc:0 "组织乡间互助会与小额赈济基金，在灾荒与饥馑时伸出援手。短期内可提升稳定与社群团结，并改善对政权的信任感；同时辅以适度的宣传可以放大效果。"
XBJ_shequn_festival:0 "乡邑庙会与文化节"
XBJ_shequn_festival_desc:0 "兴办地区性庙会与文化节，借节庆之机促进不同族群的交流与认同。效果迅速且见效明显，能短期内安抚民心并提升社群支持度，但费用与治安消耗需由地方承担。"
