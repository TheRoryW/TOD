xbj_bianjing.1.t: "川渝地方政府在冲突中落败"
xbj_bianjing.1.d: "近日，西北军与川渝地方政府在边境上爆发了局部冲突，尽管这场冲突最终没有演变为战争，但无异是西北军一次在军事上的示威活动。\n最终，西北军在这场冲突中取得了优势，川渝地方政府内部出现了对西北军的畏惧情绪。"
xbj_bianjing.1.a: "无耻之尤！"
xbj_bianjing.1.b: "大赢特赢"
xbj_bianjing.2.t: "川渝地方政府在冲突中获胜"
