### 决议 ###
# 全面接管
XBJ_jinji_guanlishu:0 "成立特别经济管理署"
XBJ_jinji_guanlishu_desc:0 "为了应对国内危机，我们决定成立特别经济管理署，以便更好管制经济和协调物资。"
XBJ_quanmian_jieguan_1:0 "金融管制"
