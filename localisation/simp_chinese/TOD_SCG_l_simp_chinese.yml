SCG_geming_jieguan_GPS:0 "向七省军发布革命通牒"
SCG_geming_jieguan_SRC:0 "向东北红军发布革命通牒"
SCG_geming_jieguan_MOB:0 "向漠北发布革命通牒"

SCG_liangyuan_zhengzhi:0 "社会主义两院政治"
SCG_liangyuan_xietiao:0 "两院协调宪政"
SCG_liangyuan_xietiao_desc:0 "人民大会与政党会在共同宪法下分工制衡，人民委员会须同时赢得两院信任。"
SCG_liangyuan_zhengzhi_zhengchang:0 "两院常规协商"
SCG_liangyuan_zhengzhi_weiji:0 "两院政治危机"
SCG_chongjian_sichuan:0 "重建的四川"
SCG_chongjian_sichuan_desc:0 "内战损害已经基本修复，公共建设重新获得稳定的社会基础。"

TODSIC.1011.t:0 "两院制的确立"
TODSIC.1011.d:0 "人民大会与政党会共同通过《四川社会主义宪法》。前者代表工农与地方组织，后者汇集参与社会主义建设的各党派；人民委员会必须同时取得两院的信任。革命政府由此转化为可协商、可监督的社会主义共和国制度。"
TODSIC.1011.a:0 "让协商成为制度。"
TODSIC.1012.t:0 "中华社会主义共和国成立"
TODSIC.1012.d:0 "全国制宪代表大会完成共同宪法。统一后的共和国不以地方联合为名，而以全国人民的代表权、多党社会主义竞争和两院协商程序为基础。四川的革命试验，已经成为中华的共同制度。"
TODSIC.1012.a:0 "人民、党派与共和国。"

### event ###
TODSIC.1001.t:0 "成都爆发起义！"
TODSIC.1001.d:0 "在生产和商业崩溃所导致的饥荒的折磨下，一群贫民冲进了市政府的大院以祈求获得能果腹的粮食。但他们惊讶地发现，胆怯的政府人士因为害怕可能爆发的暴力活动早已人去楼空了。现在，一群“叛匪”掌握了权力。"
TODSIC.1001.a:0 "革命！启动！"
TODSIC.1001.b:0 "看我派军队来，把他们一个个送上天。1"
TODSIC.1005.t:0 "革命成功！"
TODSIC.1005.d:0 "在我们的艰苦努力和各方的支持之下，革命最终以人民的胜利所告终。现在，我们控制了整个四川及乌斯藏，在外部形势尚不明确的情况下，是时候开始对内部的建设，提高人民生活水平了。"
TODSIC.1005.a:0 "新的革命开始了！"
TODSIC.1006.t:0 "联合政府建立"
TODSIC.1006.d:0 "今日，同产公会与大同党发表共同声明，他们将联手组成了四川新的政府，将为四川未来的建设发挥共同的努力。根据相关人士透露，本次申明是依照革命时期两党所签订的约定所履行的，虽然同产公会和大同党在理念上有着些许不同之处，当他们各自党内的大部分成员都对此次联合表示了赞成。"
TODSIC.1006.a:0 "携手并进"
TODSIC.1007.t:0 "四川工人总工会成立"
TODSIC.1007.d:0 "今日，四川工人总工会工会在工人代表和四川联合政府代表的共同见证下成立。与会的工人代表表示，这是工人为维护自身权益的一次重大进步，政府代表则表示，工会的成立同样是向着社会主义迈进的重要一步。"
TODSIC.1007.a:0 "属于工人自己的组织。"
