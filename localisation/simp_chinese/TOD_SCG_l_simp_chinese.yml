# 补充：四川革命政府的制度、人物与沉浸事件文本。
SCG_junduichongzu:0 "革命军队整编"
SCG_junduichongzu_desc:0 "以统一编制、补给和训练恢复部队的持续作战能力。"
SCG_liangyuan_zhengzhi_desc:0 "人民大会的授权与政党会的协调共同决定两院政治能否稳定运转。"
SCG_liangyuan_zhengzhi_zhengchang_desc:0 "两院能在公开程序下处理分歧，政府获得稳定的制度支持。"
SCG_liangyuan_zhengzhi_weiji_desc:0 "人民授权或政党协调严重不足，政治分歧正在妨碍施政。"
SCG_yang_angong_desc:0 "川中地下组织者，擅长把分散的基层力量编入统一的革命网络。"
SCG_zhong_shanfu_desc:0 "长期从事革命保卫工作，重视纪律、情报与群众安全。"
SCG_li_youting_desc:0 "熟悉军队教育与政治训练，主张以组织原则统一新生部队。"
SCG_ran_jun_desc:0 "革命军运工作者，能够把隐蔽联络转化为可靠的兵员与运输网络。"
SCG_chen_yi_desc:0 "兼具军事与宣传经验，主张让四川革命与全国形势保持联系。"
SCG_zhang_ruishu_desc:0 "国际联络工作者，善于组织跨地区的革命互助与志愿行动。"
SCG_wang_weizhou_desc:0 "来自基层的革命干部，重视把政治宣传落到实际组织中。"
SCG_guo_moruo_desc:0 "史学与文化工作者，能以公共叙事为革命制度争取理解。"
SCG_chen_baoyin_desc:0 "经济学者，主张以社会价值和公共需要校正生产分配。"
SCG_ma_zhemin_desc:0 "社会学研究者，关注制度转型中城乡、行业与社群的实际承受能力。"
SCG_qi_nanxun_desc:0 "研究同产主义经济学，强调计划、合作与劳动者利益的衔接。"
SCG_fan_hong_desc:0 "经济法学者，致力于把经营、劳动与公共监督写入可执行的规则。"
SCG_luo_ruiqing_desc:0 "革命保卫干部，重视群众治安与新政权的合法程序。"
SCG_luo_shiwen_desc:0 "工人运动组织者，能够将工会诉求转化为稳定的协商渠道。"
SCG_liu_bojian_desc:0 "军政工作者，熟悉军队纪律与地方政权之间的协调。"
SCG_xiao_chunv_desc:0 "青年运动组织者，重视教育、宣传与新一代基层干部的培养。"

SCG_geming_jieguan_GOS_desc:0 "要求两广当局接受共同纲领与全国制宪程序；拒绝者将面对革命政府的接管行动。"
SCG_geming_jieguan_GPS_desc:0 "要求七省当局接受共同纲领与全国制宪程序；拒绝者将面对革命政府的接管行动。"
SCG_geming_jieguan_MNG_desc:0 "要求大明中央接受共同纲领与全国制宪程序；拒绝者将面对革命政府的接管行动。"
SCG_geming_jieguan_MOB_desc:0 "要求漠北当局接受共同纲领与全国制宪程序；拒绝者将面对革命政府的接管行动。"
SCG_geming_jieguan_STG_desc:0 "要求顺天军接受共同纲领与全国制宪程序；拒绝者将面对革命政府的接管行动。"
SCG_geming_jieguan_XBJ_desc:0 "要求西北军接受共同纲领与全国制宪程序；拒绝者将面对革命政府的接管行动。"
SCG_geming_jieguan_XIN_desc:0 "要求西南军接受共同纲领与全国制宪程序；拒绝者将面对革命政府的接管行动。"

TODSIC.1065.t:0 "总督府的灯还亮着"
TODSIC.1065.d:0 "成都的街道尚未平静，旧政权的文书仍在流转。起义者决定先接管仓库、车站与电讯，而非让一场口号式胜利留下新的真空。谁能掌握日常秩序，谁才真正掌握成都局势。"
TODSIC.1065.a:0 "先把城市运转起来"
TODSIC.1066.t:0 "合作协议的最后一页"
TODSIC.1066.d:0 "同产公会与大同党的代表在一份薄薄的协议前争论至深夜。双方承认分歧不会消失，却同意把它留在会议桌上，而不是带到街垒之间。联合行动由此有了政治承诺。"
TODSIC.1066.a:0 "让共同目标先于分歧"
TODSIC.1067.t:0 "红军的第一份名册"
TODSIC.1067.d:0 "工人、学生与旧军队中的同情者报上姓名。新部队没有充足的装备，却明确了服从谁、保卫谁、又为何而战。革命军队首先需要的不是华丽番号，而是可被信任的纪律。"
TODSIC.1067.a:0 "把誓言写进名册"
TODSIC.1068.t:0 "胜利之后的第一天"
TODSIC.1068.d:0 "枪声渐远，成都开始清点粮食、伤员和停工的机器。革命成功并未自动带来安宁；政府必须证明自己不仅能推翻旧秩序，也能承担每一条街道、每一座工厂和每一份配给。"
TODSIC.1068.a:0 "从胜利转向建设"
TODSIC.1069.t:0 "企业改组委员会进厂"
TODSIC.1069.d:0 "会计、技师和工人代表首次坐到同一张桌前，逐项核对机器、账册与订单。改组不是简单换一块招牌，而是要回答谁负责生产、谁监督账目、又怎样让工人的意见进入日常管理。"
TODSIC.1069.a:0 "把账本公开给劳动者"
TODSIC.1070.t:0 "国有企业的第一张计划表"
TODSIC.1070.d:0 "国有化决定落下后，工厂不再只对少数股东负责，也必须开始对社会需要负责。委员会把原料、工资、订单和运输逐项列入计划，承诺以公开审计防止新的特权在公有名义下生长。"
TODSIC.1070.a:0 "让公有权力接受监督"
TODSIC.1071.t:0 "合营章程签署"
TODSIC.1071.d:0 "政府与保留下来的经营者签订合营章程：投资可以继续存在，但账目、劳动标准和关键生产必须接受公共规则。妥协并不意味着放弃方向，而是为重建保留一条可被控制的补充渠道。"
TODSIC.1071.a:0 "以规则约束资本"
TODSIC.1072.t:0 "土地丈量队下乡"
TODSIC.1072.d:0 "丈量队带着地籍簿进入乡村，既要清查兼并，也要处理祖坟、水源与佃约等具体纠纷。土地改革若只留下口号，必然被旧关系重新吞没；每一块土地都需要公开、可申诉的裁定。"
TODSIC.1072.a:0 "让土地归于耕作者"
TODSIC.1073.t:0 "合作社的冬季会议"
TODSIC.1073.d:0 "集体化方案在村社里引发激烈讨论。支持者期待共同购买农具与分担风险，怀疑者则担心新的命令会取代旧式地主。政府要求试办、记账和定期复核，集体化必须由可见的收益赢得信任。"
TODSIC.1073.a:0 "用成果而非强令说服乡村"
TODSIC.1074.t:0 "产业链上的第一批订单"
TODSIC.1074.d:0 "煤矿、机修所、纺织厂和运输站开始按同一张订单表协调生产。原本各自等待原料的工厂终于知道自己的产品将流向何处。整合的意义不在于集中一切，而在于让每一次投入都有下一步去处。"
TODSIC.1074.a:0 "让生产彼此衔接"
TODSIC.1075.t:0 "剪刀差的账目"
TODSIC.1075.d:0 "委员们把粮价、农具价格和城市工资并列在黑板上。工业优先不能以持续掏空乡村为代价，反哺农业也不能让工厂停摆。新的政策承认发展有成本，但成本必须被看见并合理分担。"
TODSIC.1075.a:0 "先算清城乡之间的账"
TODSIC.1076.t:0 "农忙之外的训练班"
TODSIC.1076.d:0 "农闲时节，合作社开办技术与识字训练班。改革不是把农民赶进城市，而是让更多人获得使用机器、管理账目和参与公共事务的能力。城乡之间的身份界线因此开始缓慢松动。"
TODSIC.1076.a:0 "让劳动者掌握新技能"
TODSIC.1077.t:0 "新经济政策的边界"
TODSIC.1077.d:0 "市场被允许在补充生产中发挥作用，但边界写得十分清楚：关键部门、劳动权利与公共物资不能成为投机对象。政策的成败取决于政府能否既保留活力，又不让临时让步变成新的不平等。"
TODSIC.1077.a:0 "在公共规则内保留活力"
TODSIC.1078.t:0 "人民军队的授旗仪式"
TODSIC.1078.d:0 "红军旧番号被编入新的人民军队。授旗仪式强调，这支军队不属于任何个人或派系，而应服务于人民、两院宪制和共同纲领。军队的力量由此开始接受制度而非私人命令的约束。"
TODSIC.1078.a:0 "军队属于人民"
TODSIC.1079.t:0 "政委制度的边界"
TODSIC.1079.d:0 "政委被赋予维持政治教育与部队纪律的责任，但会议同时强调其职责不是越过指挥系统直接发号施令。军令、补给与政治监督必须各有边界，才能避免新军队重演旧军阀的混乱。"
TODSIC.1079.a:0 "以制度约束军权"
TODSIC.1080.t:0 "民兵的值守名单"
TODSIC.1080.d:0 "村镇民兵开始编制轮值和训练名单。他们保卫桥梁、仓库与道路，也仍要回到田地和工场。民兵制度能否稳固，不取决于番号有多响亮，而取决于它是否真正嵌入社区的日常生活。"
TODSIC.1080.a:0 "让保卫力量扎根基层"
TODSIC.1081.t:0 "第一次革命后会议"
TODSIC.1081.d:0 "战时联盟在会桌前重新确认彼此关系。代表们同意先建立人民大会授权、政党会协调和重建进度三项公开尺度，让革命政府的每一项承诺都能被人民和各党派共同衡量。"
TODSIC.1081.a:0 "从共同尺度开始"
TODSIC.1082.t:0 "多党社会主义的承诺"
TODSIC.1082.d:0 "各社会主义党派承认共同纲领与革命政府的领导，同时保留公开提出修正案、参与选举和监督施政的权利。竞争被带入规则之内，多党制不再是权宜结盟，而成为制度的一部分。"
TODSIC.1082.a:0 "让分歧在制度内发生"
TODSIC.1083.t:0 "两院议事规则公布"
TODSIC.1083.d:0 "人民大会负责代表授权，政党会负责协调纲领与联合政府。新的议事规则规定议程公开、修正案程序和信任表决方式。程序或许缓慢，却让争论不必再靠密室交易和临时命令解决。"
TODSIC.1083.a:0 "规则高于临时便利"
TODSIC.1084.t:0 "责任人民委员会组成"
TODSIC.1084.d:0 "人民委员会成员必须同时面对人民大会的质询与政党会的协商。新内阁不再仅由革命资历决定，而要持续证明其施政能获得两院信任。责任内阁由此成为宪政实践的第一步。"
TODSIC.1084.a:0 "让政府对两院负责"


