### 社会主义多党两院制 ###
SCG_geminghou_diyici_huiyi:0 "革命后的第一次会议"
SCG_geminghou_diyici_huiyi_desc:0 "革命胜利并不自动带来稳定。各社会主义党派、工会和农民组织必须先商定共同的议事框架。"
SCG_duodang_shehuizhuyi:0 "承认社会主义多党制"
SCG_duodang_shehuizhuyi_desc:0 "共同目标不等于单一声音。承认党派竞争和公开协商，才能把革命联盟变为长久制度。"
SCG_jianli_renmin_dahui:0 "建立人民大会"
SCG_jianli_renmin_dahui_desc:0 "人民大会由工农、城市居民与地方组织的代表构成，掌握预算、立法和政府信任权。"
SCG_jianli_zhengdanghui:0 "建立政党会"
SCG_jianli_zhengdanghui_desc:0 "政党会由参与社会主义建设的各党派组成，负责审议计划、修正法律与确认重要任命。"
SCG_liangyuan_yishi_guize:0 "两院议事规则"
SCG_liangyuan_yishi_guize_desc:0 "法案由人民大会提出或表决，政党会复议、修正并协调；重大分歧须重新协商。"
SCG_zeren_renminweiyuanhui:0 "责任人民委员会"
SCG_zeren_renminweiyuanhui_desc:0 "人民委员会须同时维持人民大会的信任与政党会的合作，政府不再只对单一派系负责。"
SCG_sichuan_shehuizhuyi_xianfa:0 "《四川社会主义宪法》"
SCG_sichuan_shehuizhuyi_xianfa_desc:0 "以人民大会和政党会的共同程序保障劳动者权利、党派竞争和计划协商。"
SCG_renmin_zhangwo_sichuan:0 "人民掌握四川"
SCG_renmin_zhangwo_sichuan_desc:0 "战后重建已经取得决定性成果，四川的工厂、土地与公共服务终于恢复到人民手中。"
SCG_quanguo_shehuizhuyi_zhengdang_huiyi:0 "全国社会主义政党会议"
SCG_quanguo_shehuizhuyi_zhengdang_huiyi_desc:0 "邀请各地社会主义党派与工农组织讨论全国共同纲领，而非以地方联盟取代统一国家。"
SCG_quanguo_gongnong_lianluo:0 "全国工农联络"
SCG_quanguo_gongnong_lianluo_desc:0 "把各地工会、农会与基层议会纳入统一的政治联络网络。"
SCG_quanguo_renminjun:0 "全国人民军"
SCG_quanguo_renminjun_desc:0 "建设服从人民代表制度、保护共同宪法的全国军队。"
SCG_zhonghua_zhixian_dabiao_dahui:0 "中华制宪代表大会"
SCG_zhonghua_zhixian_dabiao_dahui_desc:0 "主要割据政权结束后，来自全国的代表将共同制定社会主义共和国宪法。"
SCG_zhonghua_shehuizhuyi_gongheguo:0 "中华社会主义共和国"
SCG_zhonghua_shehuizhuyi_gongheguo_desc:0 "统一的共和国以社会主义多党竞争、两院协商和人民代表权为共同制度。"
SCG_zhonghua_shehuizhuyi_gongheguo_DEF:0 "中华社会主义共和国"
SCG_zhonghua_shehuizhuyi_gongheguo_ADJ:0 "中华"

### 革命胜利后的经济重建 ###
SCG_sichuan_jingji_chongjian_weiyuanhui:0 "四川经济重建委员会"
SCG_sichuan_jingji_chongjian_weiyuanhui_desc:0 "革命胜利并没有自动修复停工的厂房、断裂的运输和混乱的账册。经济重建委员会将工会、技术人员、农民代表与地方行政集中到同一张计划表上，先确认生产、粮食和建设的底线，再允许不同经济模式在可被检验的规则内竞争。"
SCG_zuzhi_nonghui:0 "组织农会"
SCG_zuzhi_nonghui_desc:0 "农村不是城市政策的被动接受者。农会将登记粮食、土地、劳力和乡村纠纷，使农民能够参与重建的资源分配。它既为土地改革和集体化提供组织基础，也要求革命政府正视乡村在价格、征购和合作方式上的真实顾虑。"
SCG_sichuan_gongyehua_gangyao:0 "四川工业化纲要"
SCG_sichuan_gongyehua_gangyao_desc:0 "四种经济组合各有代价，革命政府必须先让实践给出答案。纲要不宣布唯一正确的所有制，而是把已经选择的生产、农业与分配机制汇成可执行的工业计划，并交由两院规则审查。没有成熟的政治程序，工业化只会重演临时征发。"
SCG_chengyu_gongye_zoulang:0 "成渝工业走廊"
SCG_chengyu_gongye_zoulang_desc:0 "成都的人才、重庆的航运与沿线的工厂若各自孤立，重建就会被运输和信息成本吞噬。成渝工业走廊以道路、仓储和厂房为共同项目，让两座城市的工人、技术人员和地方社群共享扩张收益，同时接受委员会的公开进度审查。"
SCG_chuannan_ziyuan_zhenghe:0 "川南资源整合"
SCG_chuannan_ziyuan_zhenghe_desc:0 "煤炭、盐业、粮食和地方矿产是工业化的基础，却也最容易被短期征用耗尽。川南资源整合将把采掘、运输和地方补偿列为同一计划，既增加重建能力，也让资源产地在分配和建设优先序中拥有明确的发言渠道。"
SCG_tianfu_gongyehua:0 "天府工业化"
SCG_tianfu_gongyehua_desc:0 "当走廊、资源与重建进度都达到可承受的水平，四川才能把革命后的恢复转为长期工业化。天府工业化不承诺无代价的高速增长，而是以既有经济模式、两院审议和区域建设为基础，使工厂、农业和城市供给能够相互支撑。"

SCG_chengli_geming_waijiao_lianluochu:0 "成立革命外交联络处"
SCG_chengli_geming_waijiao_lianluochu_desc:0 "四川革命不能只靠内部宣言获得全国理解。联络处将同外地社会主义团体、工农组织与同情者保持公开且可监督的联系，积累革命声望、交换经验并避免私人密约。对外联络会消耗政治信誉，因此每一次支援和表态都必须说明其回报。"
SCG_changshe_quanguo_daibiaochu:0 "常设全国代表处"
SCG_changshe_quanguo_daibiaochu_desc:0 "四川完成重建后，应把临时来访的工农代表变成常设渠道。代表处负责接收各地诉求、发布制度说明并监督援助去向，使全国联系不再只在战争与危机时才被动出现。它扩大人民大会的基础，也要求政府持续回应难以回避的地方问题。"
SCG_quanguo_tongzhan_lianhehui:0 "全国统战联合会"
SCG_quanguo_tongzhan_lianhehui_desc:0 "不同社会主义党派、工会、农会与地方代表对革命道路并不完全一致。联合会不要求所有人放弃分歧，而是规定协商、公开批评与共同动员的边界。只有让多方能在规则中竞争，四川的制度才有资格在全国范围内要求合作。"
SCG_quanguo_gongtong_gangling:0 "全国共同纲领"
SCG_quanguo_gongtong_gangling_desc:0 "共同纲领必须同时回应工农组织、政党协商、工业重建和人民军队的要求。它不以某一派的临时胜利取代全国制度，而把土地、生产、两院权力与军队责任写入能够被各地代表讨论的原则。只有政治信誉、两院授权和工业基础都成熟时，纲领才不会成为空文。"
SCG_tianfu_gongyehua_reconstruction_tt:0 "重建进度至少为 70"
SCG_quanguo_gongtong_gangling_industry_tt:0 "已完成§Y四川工业化纲要§!"
SCG_quanguo_gongtong_gangling_military_tt:0 "已完成任意一项人民军队终局国策"
SCG_quanguo_gongtong_gangling_politics_tt:0 "人民大会授权、政党会协调度均至少为 60，且革命声望至少为 50"

SCG_postwar_economy_categories:0 "四川新经济"
SCG_postwar_economy_categories_desc:0 "不同经济模式可以通过具体决议推动生产和重建。每项行动都会增加§Y重建进度§!，但会消耗政治资本并产生不同的长期取舍。\n\n重建进度：[?SCG.chongjian]"
SCG_geming_waijiao_categories:0 "革命外交联络"
SCG_geming_waijiao_categories_desc:0 "对外联络以§Y革命声望§!为资源。声望来自公开的制度建设与全国代表工作，支援、代表团和联络网络会消耗它；若只做宣传而不兑现承诺，四川便无法获得持续的政治信誉。\n\n革命声望：[?SCG.geming_shengwang]"

SCG_zhiding_shengchan_zhibiao:0 "制定生产指标"
SCG_zhiding_shengchan_zhibiao_desc:0 "将有限的原料、运输和工时集中到公开指标，优先补齐最关键的生产缺口。指标能提高短期产出，却必须定期复核，避免计划机关脱离车间与地方的实际情况。"
SCG_jizhong_zhongdian_gongye_lian:0 "集中重点工业链"
SCG_jizhong_zhongdian_gongye_lian_desc:0 "围绕少数关键行业集中建设、运输和技术人员，使相互依赖的工序不再彼此等待。它能加快建设，但也会延后边缘地区的项目，委员会必须说明优先次序的政治理由。"
SCG_tiaozheng_liangshi_shougoujia:0 "调整粮食收购价"
SCG_tiaozheng_liangshi_shougoujia_desc:0 "用更透明的收购价和补偿办法缓和农村对工业优先的担忧。此举会提高财政和城市供给压力，却能降低强制征购带来的反弹，让工农交换不至于只剩单向命令。"
SCG_butie_nongye_jixie:0 "补贴农业机械"
SCG_butie_nongye_jixie_desc:0 "将有限的机器、维修和燃料优先投向能够提高粮食与原料供给的合作单位。补贴能改善资源利用，却要防止设备只流向关系最密切的地区，因此需要农会与技术委员会共同核验。"
SCG_kuoda_hezuoshe:0 "扩大合作社"
SCG_kuoda_hezuoshe_desc:0 "以自愿加入、公共账目和技术支持扩大合作社网络。合作社能够把分散的小生产者接入重建计划，但若行政命令替代成员讨论，组织形式便会失去稳定的社会基础。"
SCG_jianli_gongren_jishu_weiyuanhui:0 "建立工人技术委员会"
SCG_jianli_gongren_jishu_weiyuanhui_desc:0 "让熟悉设备和工序的工人参与技术改良、事故调查与培训安排。委员会提高研究和生产的反馈速度，却也要求管理者接受来自车间的公开质询，不能再把技术问题完全当作行政命令。"
SCG_fafang_shengchan_xukezheng:0 "发放生产许可证"
SCG_fafang_shengchan_xukezheng_desc:0 "允许符合劳动、供给与税收规则的经营者取得生产许可证，以补足重建中难以由国家独自覆盖的民用能力。许可证不是放任资本，而是以公开条件换取建设与就业，并保留撤销权。"
SCG_jianguan_siren_ziben:0 "监管私人资本"
SCG_jianguan_siren_ziben_desc:0 "对获得许可证的私人资本实施账目、劳动与价格监管，防止重建资源被投机吞噬。监管能够换回政治空间，但标准过于任意也会破坏生产积极性，因此应由两院和技术人员共同制定可执行的边界。"

SCG_zhengqu_zhengzhi_chengren:0 "争取政治承认"
SCG_zhengqu_zhengzhi_chengren_desc:0 "向外地社会主义组织说明四川的两院制度与重建承诺，争取公开认可而非秘密结盟。行动会消耗革命声望，回报是更稳定的政治联系和可用于国内协商的信誉。"
SCG_yuanzhu_shehuizhuyi_youdang:0 "援助社会主义友党"
SCG_yuanzhu_shehuizhuyi_youdang_desc:0 "提供有限的印刷、培训与物资支持，帮助友党在本地开展公开组织工作。援助不是替代对方的自主性，而是以声望换取更广的协作网络，并让四川的多党制度接受外部检验。"
SCG_paiqian_gongnong_daibiaotuan:0 "派遣工农代表团"
SCG_paiqian_gongnong_daibiaotuan_desc:0 "由工会、农会与技术人员组成代表团，向外地说明四川的经验并带回对生产、土地与两院制度的批评。代表团能提升人民授权，却会消耗联络资源，不能沦为只报喜不报忧的宣传旅行。"
SCG_jianli_geming_lianluochu:0 "建立革命联络处"
SCG_jianli_geming_lianluochu_desc:0 "在外地建立长期、公开的联络渠道，持续交换制度信息、技术经验与政治判断。网络能够改善关系并保护革命叙事，但维持它需要声望和纪律，任何未经授权的私人承诺都会伤害四川的信誉。"

SCG_jihua_shengchan_zhibiao:0 "生产指标试行"
SCG_jihua_shengchan_zhibiao_desc:0 "委员会以可核验的指标协调关键生产，并在期限内接受车间与地方代表的修订意见。"
SCG_zhongdian_gongye_lian:0 "重点工业链集中建设"
SCG_zhongdian_gongye_lian_desc:0 "建设资源暂时向关键工序集中，以缩短重建中的设备与运输等待。"
SCG_liangshi_shougou_tiaozheng:0 "粮食收购调整"
SCG_liangshi_shougou_tiaozheng_desc:0 "更透明的补偿机制缓和了农村对工业化成本的担忧。"
SCG_nongji_butie:0 "农业机械补贴"
SCG_nongji_butie_desc:0 "农会与技术人员共同核验设备去向，使补贴服务于真实生产。"
SCG_hezuoshe_kuozhang:0 "合作社扩展"
SCG_hezuoshe_kuozhang_desc:0 "合作社在公开账目和成员讨论的基础上扩大了服务范围。"
SCG_gongren_jishu_weiyuanhui:0 "工人技术委员会"
SCG_gongren_jishu_weiyuanhui_desc:0 "车间经验被纳入技术改良和培训制度，减少了管理层与生产现场的隔阂。"
SCG_shengchan_xukezheng:0 "生产许可证制度"
SCG_shengchan_xukezheng_desc:0 "符合公共规则的经营活动被纳入重建计划，并受到持续监督。"
SCG_siren_ziben_jianguan:0 "私人资本监管"
SCG_siren_ziben_jianguan_desc:0 "公开账目与劳动标准限制投机，同时保留了补充生产的空间。"
SCG_geming_waijiao_lianluowang:0 "革命外交联络网"
SCG_geming_waijiao_lianluowang_desc:0 "持续的公开联络提高了四川革命政府的对外沟通与政治信誉。"

TODSIC.1050.t:0 "重建委员会第一次会议"
TODSIC.1050.d:0 "厂房、粮仓和运输线的代表第一次坐在同一间会议室里。没有人相信一张计划表能立刻抹去内战留下的缺口，但所有人都同意：若生产、农业与建设继续各自为政，革命的胜利只会在日常生活中被消耗。委员会决定先公开账目，再讨论道路。"
TODSIC.1050.a:0 "让重建从可核验的账目开始"
TODSIC.1051.t:0 "农会的要求"
TODSIC.1051.d:0 "乡村代表带来了粮价、劳力和土地纠纷的详细记录。他们支持革命，却拒绝再接受只从城市发出的征购命令。农会的建立意味着农民将进入重建议程，同时也要求政府在工业优先与乡村承受能力之间给出能够解释的平衡。"
TODSIC.1051.a:0 "农村必须拥有自己的声音"
TODSIC.1052.t:0 "工业化纲要提交两院"
TODSIC.1052.d:0 "四种经济模式的支持者都声称自己的道路最有效，但委员会拒绝用一句口号取代实践。纲要把已完成的企业和农业选择汇成建设、运输与资源计划，并提交两院审查。今后的争论仍会继续，却必须围绕能够被执行和检查的条款展开。"
TODSIC.1052.a:0 "让制度检验路线"
TODSIC.1053.t:0 "天府工业化的起步"
TODSIC.1053.d:0 "成渝走廊和川南资源项目同时进入建设阶段。工人看见重新运转的机器，农民看见运往市场的道路，地方代表也看见资源不再只被外运。工业化仍将带来分配冲突，但四川已经拥有处理冲突的组织与程序。"
TODSIC.1053.a:0 "把重建变成长期能力"
TODSIC.1054.t:0 "公开承认的代价"
TODSIC.1054.d:0 "外地组织愿意承认四川的革命政府，但他们要求看到两院制度、工农代表和重建承诺真正运作。联络处用声望换取政治认可，也把新的目光带回成都：今后每一次制度倒退，都会损害来之不易的信誉。"
TODSIC.1054.a:0 "承认必须由实践换取"
TODSIC.1055.t:0 "援助友党的回信"
TODSIC.1055.d:0 "收到援助的友党感谢四川的印刷、培训和物资，同时提醒成都不要把自身经验当作唯一答案。革命联络因此更像一张相互学习的网络，而不是发号施令的中心；这种克制反而提高了政党会内部的协商意愿。"
TODSIC.1055.a:0 "同路人也应保有自主性"
TODSIC.1056.t:0 "工农代表团出发"
TODSIC.1056.d:0 "代表团带着生产统计、土地改革经验和两院会议记录离开四川。他们被要求如实报告困难，而不是只展示宣传画中的成果。旅程会消耗声望与经费，但代表们带回的批评将帮助人民大会避免把地方诉求隔绝在成都之外。"
TODSIC.1056.a:0 "带着问题，也带着答案归来"
TODSIC.1057.t:0 "革命联络网形成"
TODSIC.1057.d:0 "各地联络点开始交换报刊、技术问题和政治判断。网络没有把四川变成谁的上级，却让孤立的组织能够知道彼此仍在坚持什么。维护它需要纪律与公开承诺，一旦私下交易取代共同原则，革命声望便会迅速流失。"
TODSIC.1057.a:0 "让联系经得起公开检验"
TODSIC.1058.t:0 "常设代表处开门"
TODSIC.1058.d:0 "来自各地的信件、请愿和生产报告不再只在危机时被临时处理。常设代表处将它们送入人民大会与委员会的议程，也把四川的回复带回地方。制度因此变得更慢、更麻烦，却不再只能听见最强势者的声音。"
TODSIC.1058.a:0 "代表不是一次性的来客"
TODSIC.1059.t:0 "革命外交联络处成立"
TODSIC.1059.d:0 "新机构的职责不是替四川制造遥远的敌人与盟友，而是把对外联系置于公开规则下。每一份支持、每一次代表团和每一条承诺都要说明成本与目的。革命声望由此成为可被消耗、也必须被珍惜的政治资源。"
TODSIC.1059.a:0 "以公开联系赢得信誉"
TODSIC.1060.t:0 "两院会期危机"
TODSIC.1060.d:0 "会期压力使人民大会授权与政党会协调度同时下降。有人要求立即把权力交还群众，有人则担心多党争论会让政府瘫痪。危机没有自动答案：偏向任何一方都要付出代价，而建立共同委员会则需要更多政治资本和耐心。"
TODSIC.1060.a:0 "优先恢复人民大会授权"
TODSIC.1060.b:0 "以政党妥协稳住会期"
TODSIC.1060.c:0 "成立两院联合委员会"
TODSIC.1061.t:0 "联合委员会的公开报告"
TODSIC.1061.d:0 "七天的紧急磋商没有消除所有分歧，却让两院就议程、公开记录和下一次表决程序达成了最低共识。报告承认每一方都让出了一部分便利，却也证明协商不是软弱，而是让制度在压力下仍能继续运转的能力。"
TODSIC.1061.a:0 "把妥协写入记录"
TODSIC.1062.t:0 "全国统战联合会"
TODSIC.1062.d:0 "不同党派、工农组织和地方代表围绕同一张长桌签署合作规则。他们仍将争论土地、生产和权力边界，但至少承认这些争论不能靠排斥与秘密命令解决。四川的多党制度由此第一次获得真正面向全国的组织形式。"
TODSIC.1062.a:0 "在分歧中建立共同阵线"
TODSIC.1063.t:0 "全国共同纲领通过"
TODSIC.1063.d:0 "共同纲领没有宣称已经解决所有问题。它确认工农代表、政党协商、工业重建和人民军队必须受同一套公共原则约束，并把未来的修改权留给全国代表。四川的革命道路因此不再只是地方实验，而成为可以邀请各地共同参与的制度承诺。"
TODSIC.1063.a:0 "让共同原则走向全国"
TODSIC.1064.t:0 "中华社会主义共和国成立"
TODSIC.1064.d:0 "全国代表在共同纲领和制宪程序的基础上宣布新的共和国成立。四川的经验没有被奉为唯一模板，而被写入一个允许工农、政党和地区继续参与的全国制度。战争结束后的国家将以持续的组织、协商与重建接受新的考验。"
TODSIC.1064.a:0 "革命进入建设的新阶段"

SCG_liangyuan_zhengzhi_categories:0 "两院政治"
SCG_liangyuan_zhengzhi_categories_desc:0 "§Y人民大会授权§!决定政府的民主基础；§Y政党会协调度§!决定多党合作能否稳定运行。两项均较高时，两院政治将给国家带来额外收益。\n\n人民大会授权：[?SCG.renmin_shouquan]\n政党会协调度：[?SCG.dangji_xietiao]"
SCG_chongjian_categories:0 "战后重建"
SCG_chongjian_categories_desc:0 "内战留下的土地需要通过工业、交通、粮食、复员和公共服务逐步恢复。五项方案任选四项即可达到§Y80点重建进度§!并完成主要重建。\n\n重建进度：[?SCG.chongjian]"
SCG_quanguo_geming_categories:0 "全国革命"
SCG_quanguo_geming_categories_desc:0 "以全国性的社会主义政治纲领取代地方割据，并在必要时接管拒绝参与共同制宪的政权。"
SCG_zhaokai_renmin_dahui:0 "召开人民大会"
SCG_zhaokai_renmin_dahui_desc:0 "通过公开代表会议扩大人民授权，但会增加党派协商的压力。"
SCG_kuadangpai_xietiao:0 "跨党派协调"
SCG_kuadangpai_xietiao_desc:0 "以政策协商换取政党会的稳定合作。"
SCG_yunxu_shaoshudang_xiuzheng:0 "允许少数党修正案"
SCG_yunxu_shaoshudang_xiuzheng_desc:0 "为少数意见保留制度入口，避免分歧转化为体制外对抗。"
SCG_zhengfu_xinren_biaojue:0 "政府信任表决"
SCG_zhengfu_xinren_biaojue_desc:0 "由两院同时确认人民委员会的施政授权。"
SCG_liangyuan_lifa_yali:0 "本届两院会期"
SCG_liangyuan_lifa_yali_desc:0 "预算、法案与任命不断消耗两院的政治资本。每届会期结束时，人民大会授权与政党会协调度都会下降，需要持续议政与协商。"
SCG_huifu_chengdu_gongchang:0 "恢复成都工厂"
SCG_huifu_chengdu_gongchang_desc:0 "优先修复受内战破坏最严重的工业设施。"
SCG_xiufu_chengyu_tielu:0 "修复成渝铁路"
SCG_xiufu_chengyu_tielu_desc:0 "恢复物资和人员的骨干运输线。"
SCG_wending_chengshi_liangshi:0 "稳定城市粮食"
SCG_wending_chengshi_liangshi_desc:0 "以城乡调剂和公共配给解除城市的燃眉之急。"
SCG_anzhi_fuyuan_shibing:0 "安置复员士兵"
SCG_anzhi_fuyuan_shibing_desc:0 "将复员士兵安置到生产与公共建设中，避免战争遗绪继续扩大。"
SCG_huifu_jiaoyu_yiliao:0 "恢复教育与医疗"
SCG_huifu_jiaoyu_yiliao_desc:0 "公共教育与医疗是长期重建和社会信任的基础。"
SCG_zhichi_quanguo_shehuizhuyi_dangpai:0 "支持全国社会主义党派"
SCG_zhichi_quanguo_shehuizhuyi_dangpai_desc:0 "资助各地合法的社会主义党派和基层组织，扩大共同纲领的影响。"
SCG_geming_jieguan_MNG:0 "向大明中央发布革命通牒"
SCG_geming_jieguan_GOS:0 "向两广发布革命通牒"
