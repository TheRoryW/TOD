SCG_chen_baoyin:0 "陈豹隐"
SCG_datongshehuijiazhilun:0 "大同社会价值论"
SCG_ma_zhemin:0 "马哲民"
SCG_xinshehuixue:0 "《新社会学》"
SCG_qi_nanxun:0 "漆南薰"
SCG_tongchanzhuyijingjixue:0 "同产主义经济学"
SCG_fan_hong:0 "樊弘"
SCG_jingjifaxuejia:0 "经济法学家"
SCG_luo_ruiqing:0 "罗瑞卿"
SCG_renminggongan:0 "人民公安"
